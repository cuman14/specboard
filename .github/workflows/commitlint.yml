name: Commitlint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commits (only new commits)
        run: |
          # For PRs: validate commits in the PR
          # For push to main: validate only the last commit
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.after }} --config .commitlintrc.js
          else
            npx commitlint --from HEAD~1 --to HEAD --config .commitlintrc.js
          fi
