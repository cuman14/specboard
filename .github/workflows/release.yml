name: Release

# ─────────────────────────────────────────────────────────────────
# TRIGGER
#   · push a main → job "release" decide si hay commits relevantes
#     y crea el tag. Si no los hay, el workflow termina aquí.
#   · push de tag v* → job "build" arranca directamente.
#     Esto evita compilar en cada commit a main.
# ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────
  # JOB 1 — release
  #   Corre SOLO en push a main (no en tags, no en commits del bot).
  #   release-it analiza los commits desde el último tag:
  #     · Si hay feat/fix/perf → bump de versión, CHANGELOG,
  #       tag y GitHub Release vacío (sin binarios aún).
  #     · Si no hay commits relevantes → sale limpio, released=false,
  #       el workflow termina sin lanzar builds.
  # ───────────────────────────────────────────────────────────────
  release:
    name: Version & tag
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !startsWith(github.event.head_commit.message, 'chore: update SHA256')
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout (historial completo para que release-it lea todos los tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git identity y remote con token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/cuman14/specboard.git

      - name: Run release-it
        id: release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # --ci desactiva prompts. Capturamos el exit code:
          #   0 = release publicado
          #   1 = error real
          #   EXIT_CODE distinto y mensaje "No commits" = nada que publicar
          set +e
          OUTPUT=$(pnpm release-it --ci 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "No commits since the last release"; then
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No hay commits relevantes — se omite el release"
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "released=false" >> $GITHUB_OUTPUT
            echo "❌ release-it falló con código $EXIT_CODE"
            exit $EXIT_CODE
          else
            echo "released=true" >> $GITHUB_OUTPUT
          fi

  # ───────────────────────────────────────────────────────────────
  # JOB 2 — build
  #   Corre cuando:
  #     a) Se hace push de un tag v* directamente, O
  #     b) El job release acaba de crear uno (released=true).
  #   Matrix de 3 runners en paralelo.
  #   Cada runner:
  #     1. Compila el binario nativo con tauri-action.
  #     2. Calcula el SHA256 del instalador.
  #     3. Sube el SHA256 como artifact para el job siguiente.
  #   Cache de Rust y pnpm para reducir tiempo de compilación
  #   de ~20 min a ~5-8 min en builds sucesivos.
  # ───────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: release
    if: |
      always() && (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release.outputs.released == 'true'
      )
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: sha256-windows
            installer-glob: "src-tauri/target/release/bundle/nsis/*.exe"
            rust-cache-key: windows

          # macOS Intel (x86_64) — runner macos-13
          - platform: macos-13
            artifact-name: sha256-macos-x64
            installer-glob: "src-tauri/target/release/bundle/dmg/*.dmg"
            rust-cache-key: macos-x64

          # macOS Apple Silicon (arm64) — runner macos-latest (macos-14+)
          - platform: macos-latest
            artifact-name: sha256-macos-arm
            installer-glob: "src-tauri/target/release/bundle/dmg/*.dmg"
            rust-cache-key: macos-arm

          - platform: ubuntu-22.04
            artifact-name: sha256-linux
            installer-glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            rust-cache-key: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout en el tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache de Cargo: reutiliza dependencias compiladas entre runs.
      # Primera vez sin efecto; a partir de la segunda ahorra ~12-15 min.
      - name: Cache Rust (Cargo)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust-cache-key }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        run: npm install -g pnpm

      # Cache de pnpm store: evita re-descargar paquetes npm entre runs.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.platform }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # tauri-action compila el binario y sube los instaladores
      # al GitHub Release que release-it ya creó en el job anterior.
      - name: Build y publicar binarios en GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Specboard ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false

      # sha256sum en Windows no existe por defecto; usamos certutil como fallback.
      - name: Calcular SHA256 del instalador
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.installer-glob }} 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: no se encontró instalador con patrón ${{ matrix.installer-glob }}"
            exit 1
          fi
          # sha256sum disponible en Linux/macOS/Git-bash (Windows runners lo incluyen)
          HASH=$(sha256sum "$FILE" | awk '{print $1}')
          FILENAME=$(basename "$FILE")
          echo "file=$FILENAME" > sha256.env
          echo "hash=$HASH" >> sha256.env
          echo "✓ $FILENAME → $HASH"

      - name: Subir SHA256 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: sha256.env
          retention-days: 1

  # ───────────────────────────────────────────────────────────────
  # JOB 3 — update-manifests
  #   Corre cuando los 3 builds han terminado correctamente.
  #   Descarga los 3 artifacts SHA256, actualiza
  #   scoop/specboard.json y homebrew/specboard.rb con los hashes
  #   reales, y commitea los cambios a main con [skip ci] para
  #   que no se vuelva a disparar el workflow.
  # ───────────────────────────────────────────────────────────────
  update-manifests:
    name: Update SHA256 in manifests
    needs: [release, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Descargar los 3 artifacts SHA256
        uses: actions/download-artifact@v4
        with:
          path: sha256-artifacts

      - name: Actualizar scoop y homebrew con los SHA256 reales
        run: node scripts/update-sha256.js --from-artifacts sha256-artifacts

      - name: Commit y push (solo si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoop/specboard.json homebrew/specboard.rb
          git diff --staged --quiet || \
            git commit -m "chore: update SHA256 hashes for ${{ github.ref_name }} [skip ci]"
          git push origin main

