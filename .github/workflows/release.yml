name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─────────────────────────────────────────────
# JOB 1 — release
#   · Solo corre si el commit NO es del propio bot de release
#   · release-it lee los commits desde el último tag,
#     decide si hay cambios relevantes (feat/fix/perf…),
#     bumps la versión, actualiza CHANGELOG.md,
#     crea el tag y publica el GitHub Release vacío.
#     Los binarios los sube el job build a continuación.
# ─────────────────────────────────────────────
jobs:
  release:
    name: Version & tag
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    outputs:
      tag: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout (full history para release-it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/cuman14/specboard.git

      - name: Run release-it
        id: release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # --ci desactiva los prompts interactivos
        # El output "version" y "released" lo capturamos con GITHUB_OUTPUT
        run: |
          OUTPUT=$(pnpm release-it --ci 2>&1)
          echo "$OUTPUT"

          # Extraer la versión publicada del output de release-it
          VERSION=$(echo "$OUTPUT" | grep -oP '(?<=🚀 Let'\''s release specboard \()v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # JOB 2 — build
  #   · Depende de que release haya publicado una versión.
  #   · Matrix de 3 runners en paralelo: Windows, macOS, Linux.
  #   · Cada runner compila el binario nativo con tauri-action,
  #     calcula el SHA256 del instalador y lo sube como artifact.
  # ─────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: sha256-windows
            installer-glob: "src-tauri/target/release/bundle/nsis/*.exe"

          - platform: macos-latest
            artifact-name: sha256-macos
            installer-glob: "src-tauri/target/release/bundle/dmg/*.dmg"

          - platform: ubuntu-22.04
            artifact-name: sha256-linux
            installer-glob: "src-tauri/target/release/bundle/appimage/*.AppImage"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout en el tag recién creado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm & frontend dependencies
        run: npm install -g pnpm && pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tauri app y subir binarios al GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseName: "Specboard ${{ needs.release.outputs.tag }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false

      - name: Calcular SHA256 del instalador
        shell: bash
        run: |
          FILE=$(ls ${{ matrix.installer-glob }} 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: no installer found matching ${{ matrix.installer-glob }}"
            exit 1
          fi
          HASH=$(sha256sum "$FILE" | awk '{print $1}')
          FILENAME=$(basename "$FILE")
          echo "file=$FILENAME" > sha256.env
          echo "hash=$HASH" >> sha256.env
          echo "SHA256 de $FILENAME: $HASH"

      - name: Subir SHA256 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: sha256.env
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — update-manifests
  #   · Depende de que los 3 builds hayan terminado.
  #   · Descarga los artifacts SHA256 de cada plataforma.
  #   · Ejecuta update-sha256.js que actualiza
  #     scoop/specboard.json y homebrew/specboard.rb.
  #   · Commitea y pushea esos cambios a main.
  # ─────────────────────────────────────────────
  update-manifests:
    name: Update SHA256 in manifests
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Descargar artifacts SHA256
        uses: actions/download-artifact@v4
        with:
          path: sha256-artifacts
          # Descarga sha256-windows, sha256-macos y sha256-linux
          # en subcarpetas dentro de sha256-artifacts/

      - name: Actualizar manifests con SHA256
        run: node scripts/update-sha256.js --from-artifacts sha256-artifacts

      - name: Commit y push de los manifests actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoop/specboard.json homebrew/specboard.rb
          # Solo commitea si hay cambios reales
          git diff --staged --quiet || git commit -m "chore: update SHA256 hashes for ${{ needs.release.outputs.tag }} [skip ci]"
          git push origin main
