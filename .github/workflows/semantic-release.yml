name: Semantic Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip if the commit was made by semantic-release itself
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # Use a token with write access so semantic-release can push tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        # Ignore build scripts to avoid esbuild issues
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Trigger release workflow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest tag
          TAG=$(git describe --tags --abbrev=0)
          if [ -n "$TAG" ]; then
            echo "Triggering release workflow for tag $TAG"
            gh workflow run release.yml -f tag=$TAG
          else
            echo "No tag found, skipping release workflow trigger"
          fi
