[package]
name = "specboard"
version = "0.2.0"
description = "Specboard - Visual GUI for OpenSpec"
authors = ["you"]
license = ""
repository = ""
default-run = "specboard"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "specboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "specboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
